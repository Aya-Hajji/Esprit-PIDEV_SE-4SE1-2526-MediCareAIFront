<div class="forgot-password-container">
  <div class="forgot-password-card">

    <!-- Header -->
    <div class="header">
      <h1>Réinitialisation du mot de passe</h1>
      <p class="subtitle">Récupérez l'accès à votre compte MediCareAI</p>
    </div>

    <!-- Messages d'erreur et succès -->
    <div class="alert alert-error" *ngIf="errorMessage">
      <span class="alert-icon">⚠️</span>
      {{ errorMessage }}
    </div>

    <div class="alert alert-success" *ngIf="successMessage">
      <span class="alert-icon">✓</span>
      {{ successMessage }}
    </div>

    <!-- Étape 1 : Demander le code -->
    <div class="form-group" *ngIf="step === 'request'">
      <label for="email">Adresse email</label>
      <input
        type="email"
        id="email"
        [(ngModel)]="email"
        placeholder="Entrez votre adresse email"
        class="form-control"
        [disabled]="loading"
      />
      <button
        class="btn btn-primary btn-block"
        (click)="requestReset()"
        [disabled]="loading || !email"
      >
        <span *ngIf="!loading">Envoyer le code de réinitialisation</span>
        <span *ngIf="loading">Envoi en cours...</span>
      </button>
    </div>

    <!-- Étape 2 : Entrer le code de vérification -->
    <div class="form-group" *ngIf="step === 'verify'">
      <label for="code">Code de vérification</label>
      <p class="info-text">Nous avons envoyé un code à <strong>{{ email }}</strong>.<br>Vérifiez votre boîte mail et entrez le code ci-dessous.</p>
      
      <input
        type="text"
        id="code"
        [(ngModel)]="code"
        placeholder="Entrez le code à 6 chiffres"
        class="form-control"
        [disabled]="loading"
        maxlength="6"
      />

      <button
        class="btn btn-primary btn-block"
        (click)="resetPassword()"
        [disabled]="loading || !code"
      >
        <span *ngIf="!loading">Réinitialiser mon mot de passe</span>
        <span *ngIf="loading">Réinitialisation en cours...</span>
      </button>
    </div>

    <!-- Navigation -->
    <div class="navigation">
      <button
        *ngIf="step === 'verify'"
        class="btn btn-secondary"
        (click)="step = 'request'"
        [disabled]="loading"
      >
        ← Retour
      </button>
      
      <button 
        class="btn btn-secondary"
        (click)="goToLogin()"
      >
        Retour à la connexion
      </button>
    </div>

  </div>
</div>
